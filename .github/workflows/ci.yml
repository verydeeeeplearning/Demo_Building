name: CI

# 수용 게이트(npm run check)를 PR/푸시마다 강제해 회귀 재유입을 차단한다.
# 근거: docs/plans/PLAN_layered_context_architecture.md Phase 0, service_audit R-2.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 결정적 게이트(빠른 부분) — 실패 시 차단
      - name: Unit tests
        run: npm run test:unit

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # E2E — Playwright 브라우저 설치 후 실행
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      # 의존성 취약점 — 비차단(고위험만 보고)
      - name: Dependency audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
