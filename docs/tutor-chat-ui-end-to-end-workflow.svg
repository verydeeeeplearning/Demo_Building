<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450" role="img" aria-labelledby="title desc">
  <title id="title">H-eduware Tutor Chat UI End-to-End Workflow</title>
  <desc id="desc">End-to-end simulation flow for the right-side Inspector Tutor Chat UI, from selected target question capture through frontend freshness state, non-streaming tutor endpoint, artifact authority context, live DeepAgents tutor, scoped context tools, fallback handling, and drawer rendering.</desc>
  <defs>
    <marker id="arrow-main" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-soft" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-gate" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2 L12 7 L2 12 Z" fill="#e11d48"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px "Segoe UI", Arial, sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .laneTitle { font: 800 18px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 800 16px "Segoe UI", Arial, sans-serif; fill: #0f172a; }
      .text { font: 13px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .small { font: 12px "Segoe UI", Arial, sans-serif; fill: #64748b; }
      .code { font: 12px "Cascadia Mono", Consolas, monospace; fill: #475569; }
      .tiny { font: 11px "Cascadia Mono", Consolas, monospace; fill: #475569; }
      .ui { fill: #fff7ed; stroke: #d97706; stroke-width: 2; }
      .frontend { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .backend { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
      .context { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .agent { fill: #f0fdfa; stroke: #0f766e; stroke-width: 2; }
      .tool { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .gate { fill: #fff1f2; stroke: #e11d48; stroke-width: 2; }
      .final { fill: #f0f9ff; stroke: #0284c7; stroke-width: 2; }
      .branch { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .note { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .mainLine { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#arrow-main); }
      .blueLine { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .softLine { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow-soft); }
      .gateLine { stroke: #e11d48; stroke-width: 2.5; fill: none; marker-end: url(#arrow-gate); }
      .dash { stroke-dasharray: 8 7; }
      .legendLabel { font: 12px "Segoe UI", Arial, sans-serif; fill: #334155; }
      .badge { fill: #d97706; }
      .badgeBlue { fill: #2563eb; }
      .badgeText { font: 800 12px "Segoe UI", Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1900" height="1450"/>

  <text x="56" y="55" class="title">H-eduware Tutor Chat UI End-to-End Workflow</text>
  <text x="56" y="84" class="subtitle">Actual implementation map for the second Chat UI: right-side Inspector drawer QA over selected target and current artifact authority. This path explains; it does not synthesize or mutate circuits.</text>

  <g transform="translate(56 106)">
    <rect x="0" y="0" width="164" height="28" rx="8" class="ui"/>
    <text x="12" y="19" class="legendLabel">Tutor drawer UI</text>
    <rect x="180" y="0" width="162" height="28" rx="8" class="frontend"/>
    <text x="192" y="19" class="legendLabel">Frontend state</text>
    <rect x="358" y="0" width="154" height="28" rx="8" class="backend"/>
    <text x="370" y="19" class="legendLabel">Backend endpoint</text>
    <rect x="528" y="0" width="164" height="28" rx="8" class="context"/>
    <text x="540" y="19" class="legendLabel">Artifact context</text>
    <rect x="708" y="0" width="166" height="28" rx="8" class="agent"/>
    <text x="720" y="19" class="legendLabel">Live DeepAgent</text>
    <rect x="890" y="0" width="130" height="28" rx="8" class="tool"/>
    <text x="902" y="19" class="legendLabel">Scoped tools</text>
    <rect x="1036" y="0" width="154" height="28" rx="8" class="gate"/>
    <text x="1048" y="19" class="legendLabel">Guard / fallback</text>
    <line x1="1222" y1="14" x2="1287" y2="14" class="mainLine"/>
    <text x="1297" y="19" class="legendLabel">tutor path</text>
    <line x1="1395" y1="14" x2="1460" y2="14" class="softLine dash"/>
    <text x="1470" y="19" class="legendLabel">branch / fallback</text>
  </g>

  <rect x="50" y="155" width="430" height="842" rx="14" class="lane"/>
  <rect x="510" y="155" width="600" height="842" rx="14" class="lane"/>
  <rect x="1140" y="155" width="710" height="842" rx="14" class="lane"/>
  <text x="78" y="190" class="laneTitle">Left: Inspector Tutor Chat UI</text>
  <text x="538" y="190" class="laneTitle">Center: Client Payload, Endpoint, Artifact Context</text>
  <text x="1168" y="190" class="laneTitle">Right: Tutor Runtime, DeepAgents, Scoped Tools</text>

  <g id="ui-flow">
    <rect x="82" y="220" width="350" height="78" rx="10" class="ui"/>
    <text x="105" y="249" class="boxTitle">Selected Target</text>
    <text x="105" y="271" class="text">Student selects part, connection, or whole circuit.</text>
    <text x="105" y="289" class="code">selectCircuitTarget(rawTarget)</text>

    <path class="mainLine" d="M257 298 V335"/>
    <rect x="82" y="335" width="350" height="112" rx="10" class="ui"/>
    <text x="105" y="365" class="boxTitle">Tutor Drawer Render</text>
    <text x="105" y="388" class="code">renderCircuitChatDrawer()</text>
    <text x="105" y="410" class="small">Uses currentInspectorTarget(), chatMessages,</text>
    <text x="105" y="428" class="small">suggestedQuestions ?? target.questions.</text>

    <path class="mainLine" d="M257 447 V486"/>
    <rect x="82" y="486" width="350" height="116" rx="10" class="ui"/>
    <text x="105" y="516" class="boxTitle">Question Capture</text>
    <text x="105" y="539" class="code">[data-action=suggested-question]</text>
    <text x="105" y="560" class="code">form[data-action=ask-tutor]</text>
    <text x="105" y="582" class="small">Button click or form submit calls submitTutorQuestion().</text>

    <path class="mainLine" d="M257 602 V642"/>
    <rect x="82" y="642" width="350" height="132" rx="10" class="frontend"/>
    <text x="105" y="672" class="boxTitle">Frontend Tutor State</text>
    <text x="105" y="695" class="code">state.inspector.chatMessages += student</text>
    <text x="105" y="716" class="code">tutorThinking = true</text>
    <text x="105" y="737" class="code">tutorRequestSequence += 1</text>
    <text x="105" y="758" class="small">Target changes clear messages, suggestions, thinking.</text>

    <path class="mainLine" d="M432 708 C465 708 476 708 512 708"/>
    <rect x="82" y="820" width="350" height="116" rx="10" class="gate"/>
    <text x="105" y="850" class="boxTitle">Mutation Redirect Gate</text>
    <text x="105" y="873" class="code">isCircuitModificationRequest(question)</text>
    <text x="105" y="895" class="small">Add/change/replace/revise text closes drawer</text>
    <text x="105" y="910" class="small">and routes to main chat via</text>
    <text x="105" y="927" class="code">submitAgentMessageRobust()</text>
  </g>

  <g id="client-backend-flow">
    <rect x="542" y="220" width="520" height="128" rx="10" class="frontend"/>
    <text x="570" y="251" class="boxTitle">Request Key and Tutor Payload</text>
    <text x="570" y="276" class="code">buildTutorArtifactFingerprint(currentTutorArtifacts(circuit))</text>
    <text x="570" y="297" class="code">targetScopeId(target), normalizeTutorSessionId()</text>
    <text x="570" y="318" class="small">Freshness key = targetScopeId | artifactFingerprint | locale | sequence.</text>
    <text x="570" y="337" class="small">Payload authority comes from visible artifact, not tutor memory.</text>

    <path class="mainLine" d="M802 348 V386"/>
    <rect x="542" y="386" width="520" height="132" rx="10" class="frontend"/>
    <text x="570" y="417" class="boxTitle">Client Tutor Transport</text>
    <text x="570" y="442" class="code">askCircuitTutor()</text>
    <text x="570" y="463" class="small">Default: POST JSON to agentApiUrl('/api/agent/explain-target').</text>
    <text x="570" y="482" class="small">Local debug override: localStorage.hEduwareTutorServer = disabled.</text>
    <text x="570" y="501" class="small">Cached server failure returns explicit live_tutor_fallback.</text>

    <path class="mainLine" d="M802 518 V556"/>
    <rect x="542" y="556" width="520" height="138" rx="10" class="backend"/>
    <text x="570" y="587" class="boxTitle">API / Backend Endpoint</text>
    <text x="570" y="612" class="code">POST /api/agent/explain-target</text>
    <text x="570" y="633" class="code">TutorMessageRequestSchema.parse(body)</text>
    <text x="570" y="654" class="small">Creates tutor trace id and logs tutor.request.received.</text>
    <text x="570" y="673" class="small">Calls runTutorAgent(parsed, trace/run tags/metadata).</text>

    <path class="mainLine" d="M802 694 V732"/>
    <rect x="542" y="732" width="520" height="148" rx="10" class="context"/>
    <text x="570" y="763" class="boxTitle">Artifact Authority Context</text>
    <text x="570" y="788" class="code">selectedTarget, question, running, locale</text>
    <text x="570" y="809" class="code">circuitSpec, validationReport, simulationPlan</text>
    <text x="570" y="830" class="code">renderPlan, contextCoverage, buildRunnableReport</text>
    <text x="570" y="851" class="code">solverGateResult, contextTrace</text>
    <text x="570" y="870" class="small">Server recomputes thread scope; client ids are hints only.</text>
  </g>

  <g id="runtime-flow">
    <rect x="1172" y="220" width="315" height="124" rx="10" class="agent"/>
    <text x="1198" y="251" class="boxTitle">Tutor Runtime Resolver</text>
    <text x="1198" y="276" class="code">resolveTutorRuntimeMode()</text>
    <text x="1198" y="297" class="small">Modes: auto, live, local.</text>
    <text x="1198" y="316" class="small">Live requires OPENAI_API_KEY and model.</text>
    <text x="1198" y="335" class="small">Fallback is allowed.</text>

    <rect x="1516" y="220" width="296" height="124" rx="10" class="context"/>
    <text x="1542" y="251" class="boxTitle">Thread Scope</text>
    <text x="1542" y="276" class="code">resolveTutorThreadScope()</text>
    <text x="1542" y="297" class="small">session + artifact fingerprint +</text>
    <text x="1542" y="316" class="small">target scope + locale.</text>
    <text x="1542" y="335" class="code">thread_id = tutor.session...</text>

    <path class="softLine dash" d="M1062 806 C1100 806 1115 282 1172 282"/>
    <path class="softLine dash" d="M1487 282 H1516"/>

    <path class="mainLine" d="M1329 344 V385"/>
    <rect x="1172" y="385" width="315" height="132" rx="10" class="agent"/>
    <text x="1198" y="416" class="boxTitle">Local Baseline Answer</text>
    <text x="1198" y="441" class="code">buildLocalTutorResponse()</text>
    <text x="1198" y="462" class="small">Deterministic answerTutorQuestion() baseline.</text>
    <text x="1198" y="481" class="small">Returned directly in local mode or missing live config.</text>
    <text x="1198" y="500" class="code">servingStatus = local_tutor_answer</text>

    <path class="mainLine" d="M1329 517 V558"/>
    <rect x="1172" y="558" width="315" height="150" rx="10" class="agent"/>
    <text x="1198" y="589" class="boxTitle">Live DeepAgents Tutor</text>
    <text x="1198" y="614" class="code">createDeepAgent()</text>
    <text x="1198" y="635" class="small">systemPrompt = buildLiveTutorSystemPrompt()</text>
    <text x="1198" y="654" class="small">responseFormat = provider/tool strategy.</text>
    <text x="1198" y="673" class="code">checkpointer + configurable.thread_id</text>
    <text x="1198" y="692" class="small">Invoked non-streaming with one user prompt.</text>

    <rect x="1516" y="386" width="296" height="132" rx="10" class="tool"/>
    <text x="1542" y="417" class="boxTitle">Tutor Tool Registry</text>
    <text x="1542" y="442" class="code">createTutorContextTools()</text>
    <text x="1542" y="463" class="small">Only enabled when model supports tool calling.</text>
    <text x="1542" y="482" class="code">list_tutor_context_sources</text>
    <text x="1542" y="503" class="code">read_tutor_context_doc</text>

    <rect x="1516" y="558" width="296" height="150" rx="10" class="tool"/>
    <text x="1542" y="589" class="boxTitle">Scoped Context Reads</text>
    <text x="1542" y="614" class="code">allowedSourceIds = contextTrace ids</text>
    <text x="1542" y="635" class="code">componentPartIds, primitiveIds</text>
    <text x="1542" y="656" class="small">readScopedContextSource(id, allowedSourceIds)</text>
    <text x="1542" y="675" class="small">Item-level projections prevent aggregate overreach.</text>
    <text x="1542" y="694" class="small">Tool observations return to DeepAgent messages.</text>

    <path class="softLine dash" d="M1487 623 H1516"/>
    <path class="softLine dash" d="M1516 452 C1495 452 1495 623 1516 623"/>
    <path class="softLine dash" d="M1516 675 C1495 675 1495 668 1487 668"/>

    <path class="mainLine" d="M1329 708 V752"/>
    <rect x="1172" y="752" width="640" height="128" rx="10" class="gate"/>
    <text x="1198" y="783" class="boxTitle">Parse, Ground, Fallback Guard</text>
    <text x="1198" y="808" class="code">parseLiveTutorDraftWithStatus(), LiveTutorDraftSchema.parse()</text>
    <text x="1198" y="829" class="small">Malformed output, model failure, or missing config returns local answer with</text>
    <text x="1198" y="848" class="code">servingStatus = live_tutor_fallback</text>
    <text x="1198" y="867" class="small">Fallback reason is redacted; logs store hashes/summaries, not full answers.</text>
  </g>

  <path class="mainLine" d="M1062 625 C1102 625 1126 625 1172 625"/>
  <path class="mainLine" d="M1329 880 C1329 934 1048 934 1048 1008"/>

  <rect x="50" y="1032" width="1800" height="132" rx="14" class="lane"/>
  <text x="78" y="1067" class="laneTitle">Response Delivery and Drawer Rendering</text>

  <rect x="82" y="1092" width="405" height="58" rx="10" class="backend"/>
  <text x="105" y="1118" class="boxTitle">Server Response</text>
  <text x="105" y="1139" class="code">sendJson(200, TutorMessageResponse)</text>

  <rect x="535" y="1092" width="405" height="58" rx="10" class="frontend"/>
  <text x="558" y="1118" class="boxTitle">Client Response Validation</text>
  <text x="558" y="1139" class="code">parseTutorResponse(await response.json())</text>

  <rect x="988" y="1092" width="405" height="58" rx="10" class="gate"/>
  <text x="1011" y="1118" class="boxTitle">Freshness Guard</text>
  <text x="1011" y="1139" class="code">isFreshTutorResponse(requestKey, current)</text>

  <rect x="1440" y="1092" width="360" height="58" rx="10" class="ui"/>
  <text x="1463" y="1118" class="boxTitle">Tutor Chat Rendering</text>
  <text x="1463" y="1139" class="code">chatMessages += assistant; refreshInspectorRail()</text>

  <path class="mainLine" d="M1048 1008 C1048 1060 284 1060 284 1092"/>
  <path class="mainLine" d="M487 1121 H535"/>
  <path class="gateLine" d="M940 1121 H988"/>
  <path class="mainLine" d="M1393 1121 H1440"/>

  <rect x="50" y="1202" width="1800" height="180" rx="14" class="lane"/>
  <text x="78" y="1237" class="laneTitle">Branches, Guardrails, and Differences from Main Chat UI</text>

  <rect x="82" y="1260" width="320" height="94" rx="10" class="branch"/>
  <text x="105" y="1290" class="boxTitle">Local / Offline Branch</text>
  <text x="105" y="1313" class="code">answerTutorQuestion()</text>
  <text x="105" y="1334" class="small">No model call. Uses deterministic selected-target</text>
  <text x="105" y="1352" class="small">inspection evidence and returns local_tutor_answer.</text>

  <rect x="433" y="1260" width="320" height="94" rx="10" class="branch"/>
  <text x="456" y="1290" class="boxTitle">Transport / Malformed Fallback</text>
  <text x="456" y="1313" class="code">live_tutor_fallback</text>
  <text x="456" y="1334" class="small">HTTP failure, cached failure, malformed response,</text>
  <text x="456" y="1352" class="small">or live exception returns a redacted fallback.</text>

  <rect x="784" y="1260" width="320" height="94" rx="10" class="branch"/>
  <text x="807" y="1290" class="boxTitle">Stale Response Discard</text>
  <text x="807" y="1313" class="code">target + fingerprint + locale + sequence</text>
  <text x="807" y="1334" class="small">If selected target or visible artifact changed,</text>
  <text x="807" y="1352" class="small">assistant text is not appended to the drawer.</text>

  <rect x="1135" y="1260" width="320" height="94" rx="10" class="branch"/>
  <text x="1158" y="1290" class="boxTitle">No Artifact Mutation</text>
  <text x="1158" y="1313" class="code">submitAgentMessageRobust()</text>
  <text x="1158" y="1334" class="small">Build/change/revise intent is promoted to the</text>
  <text x="1158" y="1352" class="small">main Chat UI synthesis workflow.</text>

  <rect x="1486" y="1260" width="320" height="94" rx="10" class="branch"/>
  <text x="1509" y="1290" class="boxTitle">No Streaming</text>
  <text x="1509" y="1313" class="code">fetch(...) -> full JSON body</text>
  <text x="1509" y="1334" class="small">The drawer shows tutorThinking while waiting;</text>
  <text x="1509" y="1352" class="small">the final answer is rendered after full response.</text>

  <g id="file-chips">
    <rect x="82" y="940" width="220" height="36" rx="8" class="chip"/>
    <text x="98" y="963" class="tiny">src/main.js</text>
    <rect x="542" y="940" width="255" height="36" rx="8" class="chip"/>
    <text x="558" y="963" class="tiny">src/circuitTutorClient.js</text>
    <rect x="815" y="940" width="225" height="36" rx="8" class="chip"/>
    <text x="831" y="963" class="tiny">server/index.ts</text>
    <rect x="1172" y="940" width="285" height="36" rx="8" class="chip"/>
    <text x="1188" y="963" class="tiny">server/agent/circuitTutor.ts</text>
    <rect x="1516" y="940" width="285" height="36" rx="8" class="chip"/>
    <text x="1532" y="963" class="tiny">server/agent/tutorContextTools.ts</text>
  </g>

  <g id="callouts">
    <rect x="327" y="512" width="190" height="36" rx="8" class="note"/>
    <text x="342" y="535" class="tiny">question + target</text>
    <path class="softLine dash" d="M432 544 C465 544 485 540 517 530"/>

    <rect x="888" y="902" width="260" height="36" rx="8" class="note"/>
    <text x="903" y="925" class="tiny">authority snapshot into prompt/tools</text>
    <path class="softLine dash" d="M1062 806 C1090 835 1104 875 1020 902"/>

    <rect x="1390" y="715" width="236" height="36" rx="8" class="note"/>
    <text x="1405" y="738" class="tiny">tool observations return</text>
    <path class="softLine dash" d="M1516 633 C1472 710 1420 724 1390 733"/>
  </g>
</svg>
