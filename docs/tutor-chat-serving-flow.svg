<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1400" viewBox="0 0 1500 1400" role="img" aria-labelledby="title desc">
  <title id="title">H-eduware Tutor Chat Serving Flow</title>
  <desc id="desc">Inspector Tutor Chat UI에서 선택 target 질문이 local tutor 또는 optional server/live tutor를 거쳐 답변으로 렌더링되는 흐름.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 800 34px "Segoe UI","Malgun Gothic",Arial,sans-serif; fill: #0f172a; }
      .subtitle { font: 16px "Segoe UI","Malgun Gothic",Arial,sans-serif; fill: #475569; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .ui { fill: #fff7ed; stroke: #f59e0b; stroke-width: 2; rx: 10; }
      .client { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; rx: 10; }
      .server { fill: #eef2ff; stroke: #6366f1; stroke-width: 2; rx: 10; }
      .artifact { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; rx: 10; }
      .gate { fill: #fff1f2; stroke: #f43f5e; stroke-width: 2; rx: 10; }
      .decision { fill: #ffffff; stroke: #d97706; stroke-width: 2; }
      .label { font: 800 20px "Segoe UI","Malgun Gothic",Arial,sans-serif; fill: #0f172a; }
      .boxTitle { font: 800 17px "Segoe UI","Malgun Gothic",Arial,sans-serif; fill: #0f172a; }
      .text { font: 14px "Segoe UI","Malgun Gothic",Arial,sans-serif; fill: #334155; }
      .small { font: 13px "Segoe UI","Malgun Gothic",Arial,sans-serif; fill: #64748b; }
      .code { font: 12px "Cascadia Mono",Consolas,monospace; fill: #475569; }
      .line { stroke: #d97706; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke-dasharray: 8 7; }
      .branch { font: 800 14px "Segoe UI",Arial,sans-serif; fill: #0f172a; }
      .num { fill: #d97706; }
      .numText { font: 800 14px "Segoe UI",Arial,sans-serif; fill: #ffffff; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="1400"/>
  <text x="56" y="64" class="title">Inspector Tutor Chat UI: 선택 target 질문 처리 흐름</text>
  <text x="56" y="98" class="subtitle">이 경로는 새 회로 합성이 아니라, 현재 artifact와 선택된 부품/전선/회로를 근거로 설명을 생성하는 QA surface다.</text>

  <rect class="lane" x="56" y="145" width="300" height="1130"/>
  <rect class="lane" x="420" y="145" width="300" height="1130"/>
  <rect class="lane" x="784" y="145" width="300" height="1130"/>
  <rect class="lane" x="1148" y="145" width="300" height="1130"/>
  <text x="86" y="190" class="label">UI</text>
  <text x="450" y="190" class="label">Client Tutor</text>
  <text x="814" y="190" class="label">Server / Live Tutor</text>
  <text x="1178" y="190" class="label">Artifact Context</text>

  <circle class="num" cx="91" cy="252" r="16"/><text class="numText" x="86" y="258">1</text>
  <rect class="ui" x="112" y="220" width="242" height="104"/>
  <text x="134" y="254" class="boxTitle">target 선택</text>
  <text x="134" y="282" class="text">part / connection / circuit</text>
  <text x="134" y="304" class="code">selectCircuitTarget()</text>

  <path class="line" d="M233 324 V382"/>
  <circle class="num" cx="91" cy="414" r="16"/><text class="numText" x="86" y="420">2</text>
  <rect class="ui" x="112" y="382" width="242" height="126"/>
  <text x="134" y="416" class="boxTitle">drawer 열기</text>
  <text x="134" y="444" class="text">선택 target 요약 표시</text>
  <text x="134" y="468" class="text">suggested questions 표시</text>
  <text x="134" y="490" class="code">renderCircuitChatDrawer()</text>

  <path class="line" d="M233 508 V568"/>
  <circle class="num" cx="91" cy="600" r="16"/><text class="numText" x="86" y="606">3</text>
  <rect class="ui" x="112" y="568" width="242" height="124"/>
  <text x="134" y="602" class="boxTitle">질문 submit</text>
  <text x="134" y="630" class="text">student message append</text>
  <text x="134" y="654" class="text">thinking state on</text>
  <text x="134" y="676" class="code">submitTutorQuestion()</text>

  <path class="line" d="M354 630 H442"/>
  <circle class="num" cx="451" cy="252" r="16"/><text class="numText" x="446" y="258">4</text>
  <rect class="client" x="476" y="220" width="242" height="126"/>
  <text x="498" y="254" class="boxTitle">payload 구성</text>
  <text x="498" y="282" class="text">target + question</text>
  <text x="498" y="306" class="text">running + locale</text>
  <text x="498" y="328" class="code">askCircuitTutor()</text>

  <path class="lineBlue dash" d="M718 283 H1172"/>
  <rect class="artifact" x="1176" y="220" width="270" height="204"/>
  <text x="1198" y="254" class="boxTitle">보내는 artifact 근거</text>
  <text x="1198" y="282" class="code">selectedTarget</text>
  <text x="1198" y="306" class="code">circuitSpec</text>
  <text x="1198" y="330" class="code">validationReport</text>
  <text x="1198" y="354" class="code">simulationPlan</text>
  <text x="1198" y="378" class="code">contextCoverage</text>
  <text x="1198" y="402" class="code">buildRunnableReport, solverGate, trace</text>

  <path class="line" d="M597 346 V420"/>
  <polygon class="decision" points="597,420 710,480 597,540 484,480"/>
  <text x="548" y="476" class="boxTitle">server opt-in?</text>
  <text x="536" y="500" class="small">localStorage enabled</text>

  <path class="line" d="M597 540 V618"/>
  <text x="613" y="582" class="branch">No</text>
  <rect class="client" x="476" y="618" width="242" height="126"/>
  <text x="498" y="652" class="boxTitle">기본 경로</text>
  <text x="498" y="680" class="text">로컬 deterministic 답변</text>
  <text x="498" y="704" class="code">answerTutorQuestion()</text>
  <text x="498" y="726" class="small">servingStatus: local_tutor_answer</text>

  <path class="line" d="M710 480 H806"/>
  <text x="738" y="464" class="branch">Yes</text>
  <rect class="server" x="812" y="418" width="242" height="126"/>
  <text x="834" y="452" class="boxTitle">server endpoint</text>
  <text x="834" y="480" class="code">POST /api/agent/explain-target</text>
  <text x="834" y="504" class="text">schema parse + tutor trace</text>
  <text x="834" y="526" class="code">runTutorAgent()</text>

  <path class="line" d="M933 544 V618"/>
  <polygon class="decision" points="933,618 1054,680 933,742 812,680"/>
  <text x="885" y="676" class="boxTitle">live tutor?</text>
  <text x="852" y="700" class="small">H_EDUWARE_TUTOR_MODE=live</text>

  <path class="line" d="M812 680 H760 V1057 H718"/>
  <text x="738" y="664" class="branch">No</text>
  <rect class="server" x="812" y="784" width="242" height="130"/>
  <text x="834" y="818" class="boxTitle">live 경로</text>
  <text x="834" y="846" class="text">stateless DeepAgent QA</text>
  <text x="834" y="870" class="code">toolStrategy(LiveTutorDraft)</text>
  <text x="834" y="892" class="small">새 회로 합성 도구 없음</text>

  <path class="line" d="M933 742 V784"/>
  <text x="949" y="766" class="branch">Yes</text>

  <path class="line" d="M933 914 V986"/>
  <rect class="gate" x="812" y="986" width="242" height="142"/>
  <text x="834" y="1020" class="boxTitle">fallback guard</text>
  <text x="834" y="1048" class="text">malformed response 차단</text>
  <text x="834" y="1072" class="text">transport/live 실패 redaction</text>
  <text x="834" y="1096" class="small">servingStatus: live_tutor_fallback</text>

  <path class="line" d="M812 1057 H718"/>
  <path class="line" d="M597 744 V1057 H718"/>
  <rect class="client" x="476" y="1000" width="242" height="114"/>
  <text x="498" y="1034" class="boxTitle">response normalize</text>
  <text x="498" y="1062" class="text">message trim</text>
  <text x="498" y="1086" class="text">fallbackReason redaction</text>

  <path class="line" d="M476 1057 H354"/>
  <circle class="num" cx="91" cy="1057" r="16"/><text class="numText" x="86" y="1063">5</text>
  <rect class="ui" x="112" y="984" width="242" height="146"/>
  <text x="134" y="1018" class="boxTitle">drawer 렌더링</text>
  <text x="134" y="1046" class="text">assistant message append</text>
  <text x="134" y="1070" class="text">servingStatus badge</text>
  <text x="134" y="1094" class="text">suggestedQuestions 갱신</text>

  <rect class="gate" x="112" y="1210" width="1334" height="86"/>
  <text x="138" y="1244" class="boxTitle">Tutor Chat의 경계</text>
  <text x="138" y="1272" class="text">선택 target과 현재 artifact 밖의 wiring, current path, supported hardware를 새로 발명하지 않는다. validation/simulation이 valid가 아니면 전류 흐름 claim을 하지 않는다.</text>
</svg>
